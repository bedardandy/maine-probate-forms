# PP-408 — Notice of Disallowance of Claim (conservatorship analog of DE-503).
# Two attorneys: one for the claimant, one for the conservator.

skill_metadata:
  filer_role: conservator
  statutes:
    - "18-C M.R.S.A. § 5-428 (Conservatorship claims)"
  service_required: true
  filing_deadline_days: 60
  filing_deadline_anchor: "claim_filing_date"


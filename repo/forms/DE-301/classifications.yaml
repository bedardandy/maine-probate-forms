# Formal petition — per-form classification overrides.

overrides:
  # "<party>_contact" must source the contact record key, not the party's
  # name (the classifier's party-attr rule reduced the subcategory to the
  # bare party name).
  petitioner_contact:
    category: party_attr
    party: petitioner
    subcategory: petitioner_contact
    data_type: text

  order_limitations:
    category: external
    subcategory: court_only
    court_only: true
    fill_strategy_source: left_blank
  petitioner_interest_other_details:
    suppress_geometry: true
  judge_date:
    category: external
    subcategory: court_only
    court_only: true
    fill_strategy_source: left_blank
  certified_copy_date:
    category: external
    subcategory: court_only
    court_only: true
    fill_strategy_source: left_blank
  special_admin_acceptance_date:
    suppress_geometry: true

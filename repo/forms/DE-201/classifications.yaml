# Formal petition — per-form classification overrides.

overrides:
  # "<party>_contact" must source the contact record key, not the party's
  # name (the classifier's party-attr rule reduced the subcategory to the
  # bare party name).
  petitioner_contact:
    category: party_attr
    party: petitioner
    subcategory: petitioner_contact
    data_type: text

  decedent_name_caption:
    suppress_geometry: true

  filing_fee:
    category: external
    subcategory: court_only
    court_only: true
    fill_strategy_source: left_blank
  mailing_notices_fee:
    category: external
    subcategory: court_only
    court_only: true
    fill_strategy_source: left_blank
  publication_fee:
    category: external
    subcategory: court_only
    court_only: true
    fill_strategy_source: left_blank

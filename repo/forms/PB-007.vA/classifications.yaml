    parent_section: appointment_level
    data_type: text
    writable_when: {all_of: [{field: appointment_level, equals: "expanded"}]}

  expanded_other_provisions:
    category: narrative_derived
    subcategory: conditional_section_child
    parent_section: appointment_level
    data_type: text
    writable_when: {all_of: [{field: appointment_level, equals: "expanded"}]}

  appointment_end_event:
    category: narrative_derived
    subcategory: termination_condition
    data_type: text

  appointment_end_date:
    category: narrative_derived
    subcategory: event_date
    data_type: date

  report_requirement:
    category: legal_choice
    subcategory: report_election
    data_type: text

  summary_report_deadline:
    category: narrative_derived
    subcategory: event_date
    data_type: date


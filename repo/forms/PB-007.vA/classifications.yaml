    subcategory: other_payor
    party: other_payor
    data_type: person_name

  other_periodic_frequency:
    category: legal_choice
    subcategory: payment_frequency
    data_type: text

  # Same enumerations as PB-007 main variant (with synonym aliases).
  gal_roster_status:
    category: narrative_derived
    subcategory: gal_roster
    data_type: text
    validators:
      - "value_in(rostered, on_roster, not_rostered, waived)"

  objection_status:

    subcategory: free_text
    data_type: text

  other_objector_name_fee:
    category: party_attr
    subcategory: other_objector
    party: objector
    data_type: person_name

  fee_factors:
    category: narrative_derived
    subcategory: free_text
    data_type: text

  limited_duties:
    category: narrative_derived
    subcategory: conditional_section_child
    parent_section: appointment_level
    data_type: text
    writable_when: {all_of: [{field: appointment_level, equals: "limited"}]}

  limited_hearing_appearance:
    category: narrative_derived
    subcategory: conditional_section_child
    parent_section: appointment_level
    data_type: text
    writable_when: {all_of: [{field: appointment_level, equals: "limited"}]}

  limited_other_provisions:

# PB-007 — Order Appointing Guardian Ad Litem (GAL).
# Three-tier appointment level (limited / standard / expanded) gates the
# bulk of the form's fields via writable_when. Fee/payment structure is
# similarly conditional on payment_method.

overrides:
  county_probate:
    category: case_constant
    subcategory: county
    data_type: entity_name

  case_title:
    category: case_constant
    subcategory: case_caption
    data_type: text

  appointment_level:
    category: legal_choice
    subcategory: appointment_scope
    data_type: text
    choice_group: appointment_level
    validators:
      - "value_in(limited, standard, expanded)"

  minor_children_names:
    category: party_attr
    subcategory: minor_children
    party: minor
    data_type: text

  gal_name:
    category: party_attr
    subcategory: gal
    party: gal
    data_type: person_name

  good_cause_findings:
    category: narrative_derived
    subcategory: free_text
    data_type: text

  other_qualifications_detail:
    category: narrative_derived
    subcategory: free_text
    data_type: text

  objecting_parties_appointment:
    category: narrative_derived
    subcategory: free_text
    data_type: text

  other_objector_name_appointment:
    category: party_attr
    subcategory: other_objector
    party: objector
    data_type: person_name

  appointment_factors:
    category: narrative_derived
    subcategory: free_text
    data_type: text

  objecting_parties_fee:

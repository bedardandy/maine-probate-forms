    category: legal_choice
    subcategory: payment_method
    data_type: text
    choice_group: payment_method
    # Includes "periodic_bill" as a synonym for "periodic" since the
    # form's exact wording isn't yet verified against the PDF.
    validators:
      - "value_in(lump_sum, percent, periodic, periodic_bill, other)"

  lump_sum_deadline:
    category: narrative_derived
    subcategory: event_date
    data_type: date
    writable_when: {all_of: [{field: payment_method, equals: "lump_sum"}]}


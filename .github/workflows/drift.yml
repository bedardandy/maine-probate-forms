name: upstream-drift

# Re-probe the maine.gov source URLs and flag any form that has been re-issued
# since its fill_geometry was measured. Scheduled (not a per-PR gate) because it
# needs network and reflects state on maineprobate.net, not a PR.

on:
  schedule:
    - cron: "29 7 * * 1" # Mondays 07:29 UTC
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyMuPDF (downloader shares build_pdf_manifest)
        run: python -m pip install --upgrade pip pymupdf
      - name: Probe source URLs against the manifest
        # Non-zero exit means a form CHANGED or its URL is GONE. The JSON report
        # names every affected form; re-derive their geometry, then rebuild the
        # manifest with tools/build_pdf_manifest.py.
        run: python3 tools/check_upstream.py --json | tee drift-report.json
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: drift-report.json

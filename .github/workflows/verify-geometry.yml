name: verify-fill-geometry

# Gate that shipped fill_geometry.json stays valid against the schemas.
# Pure stdlib — no dependencies to install.
on:
  push:
    branches: [main]
    paths:
      - 'repo/forms/**'
      - 'catalog/fill_geometry_status.json'
      - 'scripts/verify_fill_geometry.py'
  pull_request:
    paths:
      - 'repo/forms/**'
      - 'catalog/fill_geometry_status.json'
      - 'scripts/verify_fill_geometry.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fill geometry against schemas
        run: python3 scripts/verify_fill_geometry.py --repo .

name: verify-pdf-manifest

# Offline gate: the source-PDF SHA-256 anchor stays well-formed and covers every
# form. Pure stdlib, no network — runs on every change to the manifest, the
# source URLs, or the verifier.
on:
  push:
    branches: [main]
    paths:
      - 'catalog/pdf_manifest.json'
      - 'catalog/source_urls.json'
      - 'tools/verify.py'
      - 'scripts/verify_manifest.py'
  pull_request:
    paths:
      - 'catalog/pdf_manifest.json'
      - 'catalog/source_urls.json'
      - 'tools/verify.py'
      - 'scripts/verify_manifest.py'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pdf_manifest structure + guard self-test
        run: python3 scripts/verify_manifest.py
